<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Body Segmentation Interface</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 0.5px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px;
        }
        .upload-area {
            border: 2px dashed #3b82f6;
            padding: 40px;
            border-radius: 8px;
            background-color: #eff6ff;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .upload-area:hover {
            background-color: #dbeafe;
        }
        .upload-area svg {
            margin-bottom: 15px;
            stroke: #3b82f6;
        }
        .upload-area p {
            margin: 0;
            font-size: 16px;
            color: #4b5563;
        }
        input[type="file"] {
            display: none;
        }
        .btn-container {
            text-align: center;
            margin-top: 25px;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .loading {
            display: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #1e3a8a;
            margin-top: 25px;
        }
        .error-box {
            display: none;
            background-color: #fee2e2;
            border: 1px solid #f87171;
            color: #b91c1c;
            padding: 15px;
            border-radius: 6px;
            margin-top: 25px;
            text-align: center;
            font-weight: bold;
        }
        .results-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
            display: none; /* Hidden until processing succeeds */
        }
        .preview-box {
            text-align: center;
        }
        .preview-box h3 {
            margin-bottom: 15px;
            color: #1e3a8a;
            font-size: 18px;
        }
        .preview-box img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            background-color: #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Water Segmentation Deployment</h1>
            <p style="margin: 6px 0 0 0; opacity: 0.9; font-size: 15px;">ResNet-50 + U-Net Decoder (12-Channel Input)</p>
        </header>

        <div class="card">
            <form id="inferenceForm">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <svg width="48" height="48" fill="none" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p>Click here to choose a 12-channel TIFF file</p>
                    <span id="fileNameDisplay" style="display: block; margin-top: 15px; font-weight: bold; color: #1e3a8a;"></span>
                    <input type="file" id="fileInput" name="file" accept=".tif,.tiff" onchange="showFileName()">
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn">Segment Water Bodies</button>
                </div>
            </form>

            <div class="loading" id="loadingSpinner">Preprocessing spectral bands and executing model inference...</div>
            <div class="error-box" id="errorConsole"></div>

            <div class="results-panel" id="resultsGrid">
                <div class="preview-box">
                    <h3>Uploaded Image Preview (RGB)</h3>
                    <img id="rgbImg" src="" alt="RGB Composite Preview">
                </div>
                <div class="preview-box">
                    <h3>Generated Water Mask</h3>
                    <img id="maskImg" src="" alt="Binary Water Mask">
                </div>
            </div>
        </div>
    </div>

    <script>
        function showFileName() {
            const input = document.getElementById('fileInput');
            const display = document.getElementById('fileNameDisplay');
            if (input.files.length > 0) {
                display.textContent = input.files[0].name;
            }
        }

        document.getElementById('inferenceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("Please select a valid multispectral .tif file first.");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const spinner = document.getElementById('loadingSpinner');
            const errorConsole = document.getElementById('errorConsole');
            const resultsGrid = document.getElementById('resultsGrid');
            
            spinner.style.display = 'block';
            errorConsole.style.display = 'none';
            resultsGrid.style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                spinner.style.display = 'none';

                if (response.ok && data.success) {
                    document.getElementById('rgbImg').src = "data:image/png;base64," + data.rgb_preview;
                    document.getElementById('maskImg').src = "data:image/png;base64," + data.mask_image;
                    resultsGrid.style.display = 'grid';
                } else {
                    errorConsole.textContent = data.error || "Inference failed due to a server-side processing error.";
                    errorConsole.style.display = 'block';
                }
            } catch (err) {
                spinner.style.display = 'none';
                errorConsole.textContent = "Network Error: Failed to establish connection with Flask server.";
                errorConsole.style.display = 'block';
            }
        });
    </script>
</body>
</html>
